<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ייפוי כוח לחתימה – עו"ד איתמר צור</title>
<style>
:root{--bg:#f4f6f9;--fg:#18202c;--muted:#5b6576;--card:#fff;--line:#d3d9e2;--accent:#1f5fd1;--ok:#17703f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,"Noto Sans Hebrew","Noto Sans Arabic",system-ui,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:680px;margin:0 auto;padding:18px max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
h1{font-size:1.25rem;margin:0}
.sub{color:var(--muted);font-size:.92rem}
#doc{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:6px;display:block}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
label{font-weight:700}
#pad{width:100%;height:200px;background:#fff;border:2px dashed var(--accent);border-radius:8px;touch-action:none;display:block}
input{font:inherit;padding:11px;border:1px solid var(--line);border-radius:8px;direction:ltr;text-align:center;width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:700;padding:13px 16px;border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--fg)}
.main{background:var(--accent);border-color:var(--accent);color:#fff;flex:1}
#msg{font-weight:700;min-height:1.5em}
.ok{color:var(--ok)}
</style></head><body>
<div class="wrap">
  <div><h1>ייפוי כוח לחתימה – עו"ד איתמר צור</h1>
  <div class="sub">توكيل للتوقيع – المحامي إيتمار تسور · Power of attorney for signature</div></div>
  <canvas id="doc"></canvas>
  <div class="box">
    <label for="phone">מספר טלפון (לא חובה) · رقم التلفون (اختياري) · Phone (optional)</label>
    <input id="phone" type="tel" inputmode="tel" autocomplete="tel">
    <label for="pad">חתום כאן באצבע · وقّع هنا بإصبعك · Sign here with your finger</label>

    <div class="row"><button id="clear" type="button">ניקוי · مسح · Clear</button></div>
    <div class="row"><button id="send" class="main" type="button">שליחה לעורך הדין · إرسال للمحامي · Send</button></div>
    <div id="msg" role="status"></div>
  </div>
</div>
